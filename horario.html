
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendaHub</title>
    <link rel="icon" href="imgs/agendahub-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>

        <div class="main">
            <img src="imgs/menu.png" id="menuBtn">
            <h1>AgendaHub</h1>
        </div>

        <div class="buttons">
            <img src="imgs/user.png" alt="user" id="userIcon">
        </div>


        

    </header>

    <div class="sidebar" id="sidebar">

        <div class="item"><img src="imgs/casa.png"><a href="index.html">Inicio</a></div>
        <div class="item"><img src="imgs/schedule.png" alt=""><a href="horario.html">Horario</a></div>
        <div class="item"><img src="imgs/calendar.png" alt=""><a href="calendario.html">Calendario</a></div>
        <div class="item"><img src="imgs/task.png" alt=""><a href="task.html">Tareas</a></div>
        <div class="item"><img src="imgs/bars.png" alt=""><a href="mark.html">Calificaciones</a></div>
        <div class="item"><img src="imgs/libro.png" alt=""><a href="subjects.html">Asignaturas</a></div>
    </div>


    <main class="horario-main">

        <section class="horario-section">

            <div class="horario-header">

                <div>
                    <h1>Mi horario</h1>
                    <p id="weekRange"></p>
                </div>

                <div class="horario-actions">

                    <button id="previousWeek">
                        ‹
                    </button>

                    <button id="today">
                        Hoy
                    </button>

                    <button id="nextWeek">
                        ›
                    </button>

                    <button id="addScheduleEvent">
                        + Añadir
                    </button>

                </div>

            </div>



            <div class="schedule-container">

                <div id="scheduleGrid">

                    <!-- Lo generará JavaScript -->

                </div>

            </div>

        </section>

    </main>

    <!-- MODAL CREAR EVENTO -->

    <div class="modal" id="scheduleModal">

        <div class="event-form">

            <h2 id="eventFormTitle">Nuevo evento</h2>


            <div class="form-group">

                <label for="scheduleTitle">Nombre del evento</label>
                <input 
                    type="text"
                    id="scheduleTitle"
                    placeholder="Nombre del evento"
                >

            </div>


            <div class="event-basic-info">

                <div class="form-group">

                    <label for="scheduleSubject">Asignatura</label>
                    <select id="scheduleSubject">
                    </select>

                </div>

                <div class="form-group">

                    <label for="scheduleColor">Color</label>
                    <input
                        type="color"
                        id="scheduleColor"
                        value="#60A561"
                    >

                </div>

                <div class="form-group">

                    <label for="scheduleCalendar">Calendario</label>
                    <select id="scheduleCalendar">
                        <option value="">Selecciona un calendario</option>
                        <option value="bachillerato">Bachillerato</option>
                        <option value="personal">Personal</option>
                    </select>

                </div>

            </div>

            <div class="form-section">

                <h3>Fecha y hora</h3>

                <div class="event-dates">

                    <div class="form-group">

                        <label for="scheduleStartDate">Inicio</label>
                        <input 
                            type="date"
                            id="scheduleStartDate"
                        >

                    </div>

                    <div class="form-group">

                        <label for="scheduleEndDate">Fin</label>
                        <input 
                            type="date"
                            id="scheduleEndDate"
                        >

                    </div>

                </div>


                <div class="event-times">

                    <div class="form-group">

                        <label for="eventTime">Hora de inicio</label>
                        <input 
                            type="time"
                            id="eventTime"
                        >

                    </div>

                    <div class="form-group">

                        <label for="eventEndTime">Hora de finalización</label>
                        <input 
                            type="time"
                            id="eventEndTime"
                        >

                    </div>

                </div>

            </div>

        <div class="advanced-options">

                <button
                    type="button"
                    id="advancedOptionsBtn"
                    class="advanced-options-button"
                >
                    <span>Opciones avanzadas</span>
                    <span class="advanced-arrow">⌄</span>
                </button>


                <div
                    id="advancedOptionsContent"
                    class="advanced-options-content"
                >

                    <div class="form-group">

                        <label class="checkbox-label">
                            <input
                                type="checkbox"
                                id="scheduleRepeat"
                            >
                            <span>Repetir evento</span>

                        </label>

                    </div>


                    <div
                        id="repeatDaysGroup"
                        class="event-repeat-options"
                        style="display: none;"
                    >

                        <p>Repetir los días:</p>

                        <div class="repeat-days">

                            <label>
                                <input
                                    type="checkbox"
                                    class="event-repeat-day"
                                    value="0"
                                >
                                Lunes
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    class="event-repeat-day"
                                    value="1"
                                >
                                Martes
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    class="event-repeat-day"
                                    value="2"
                                >
                                Miércoles
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    class="event-repeat-day"
                                    value="3"
                                >
                                Jueves
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    class="event-repeat-day"
                                    value="4"
                                >
                                Viernes
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    class="event-repeat-day"
                                    value="5"
                                >
                                Sábado
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    class="event-repeat-day"
                                    value="6"
                                >
                                Domingo
                            </label>

                        </div>

                    </div>


                <div class="form-group">

                        <label class="checkbox-label">
                            <input
                                type="checkbox"
                                id="eventShowInCalendar"
                                checked
                            >

                            <span>Mostrar en el calendario</span>

                        </label>

                    </div>

                </div>

            </div>


            <div class="form-group">

                <label for="scheduleDescription">Descripción</label>

                <textarea
                    id="scheduleDescription"
                    placeholder="Añade una descripción..."
                ></textarea>

            </div>


        <p class="form-error" id="formError"></p>


            <div class="form-buttons">

                <button id="cancelSchedule">
                    Cancelar
                </button>

                <button id="saveSchedule">
                    Guardar
                </button>

            </div>

        </div>

    </div>


    <!-- MODAL INFORMACIÓN DEL EVENTO -->

    <div id="scheduleInfoModal" class="modal">

        <div class="schedule-form">

            <h2 id="scheduleInfoTitle"></h2>

            <div class="schedule-info">

                <p>
                    <strong>Día:</strong>
                    <span id="scheduleInfoDay"></span>
                </p>

                <p>
                    <strong>Horario:</strong>
                    <span id="scheduleInfoTime"></span>
                </p>

                <p>
                    <strong>Descripción:</strong>
                    <span id="scheduleInfoDescription"></span>
                </p>

            </div>

            <div class="modal-buttons">

                <button id="closeScheduleInfo">
                    Cerrar
                </button>

                <button id="editSchedule">
                    Editar
                </button>

                <button id="deleteSchedule">
                    Eliminar
                </button>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script src="horario.js"></script>
    <script src="script.js"></script>

</body>

</html>

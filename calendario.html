<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendaHub</title>
    <link rel="icon" href="imgs/agendahub-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>

        <div class="main">
            <img src="imgs/menu.png" id="menuBtn">
            <h1>AgendaHub</h1>
        </div>

        <div class="buttons">
            <img src="imgs/user.png" alt="user" id="userIcon">
        </div>


        

    </header>

    <div class="sidebar" id="sidebar">

        <div class="item"><img src="imgs/casa.png"><a href="index.html">Inicio</a></div>
        <div class="item"><img src="imgs/schedule.png" alt=""><a href="horario.html">Horario</a></div>
        <div class="item"><img src="imgs/calendar.png" alt=""><a href="calendario.html">Calendario</a></div>
        <div class="item"><img src="imgs/task.png" alt=""><a href="task.html">Tareas</a></div>
        <div class="item"><img src="imgs/bars.png" alt=""><a href="mark.html">Calificaciones</a></div>
        <div class="item"><img src="imgs/libro.png" alt=""><a href="subjects.html">Asignaturas</a></div>
    </div>

    
    <main>


        <div class="seccion-vistas-agenda">


            <div class="eventos">

            <div class="title">
                <h2>Mi agenda</h2>

                <div class="buttons">

                    <button id="todayBtn">Hoy</button>

                    <div class="view-selector">
                        <button id="viewBtn">
                            Mes 
                            <span class="icon icon-down" aria-hidden="true">
                                <svg viewBox="0 0 24 24">
                                    <path d="M6 9L12 15L18 9"></path>
                                </svg>
                            </span>
                        </button>

                        <div class="view-menu" id="viewMenu">
                            <button data-view="month">Mes</button>
                            <button data-view="week">Semana</button>
                            <button data-view="day">Día</button>
                        </div>
                    </div>


                    <button id="calendarsBtn">Calendarios</button>

                    <button id="addEvent"> + </button>
                </div>

                
            </div>


            <div class="calendar" id="calendar">

                <div class="calendar-header" id="calendarHeader">

                    <button id="prevMonth">
                        <span class="icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M15 18L9 12L15 6"></path>
                            </svg>
                        </span>
                    </button>

                    <h2 id="currentMonth">Septiembre</h2>

                    <button id="nextMonth">
                        <span class="icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M9 18L15 12L9 6"></path>
                            </svg>
                        </span>
                    </button>
                </div>

                <div class="calendar-weekdays">

                    <span>LUN</span>
                    <span>MAR</span>
                    <span>MIÉ</span>
                    <span>JUE</span>
                    <span>VIE</span>
                    <span>SÁB</span>
                    <span>DOM</span>

                </div>

                <div class="calendar-days" id="calendarDays"></div>

            </div>
            </div>


            <div class="calendars-panel">

                <div class="calendars-header">
                    <h4>Mis calendarios</h4>

                    <button id="addCalendar">+</button>
                </div>

                <div id="calendarList"></div>

            </div>

        </div>

        


    </main>



    <div class="modal" id="eventModal">

        <div class="event-form">

            <h2 id="eventFormTitle">Nuevo evento</h2>


            <div class="form-group">

                <label for="eventTitle">Nombre del evento</label>
                <input 
                    type="text"
                    id="eventTitle"
                    placeholder="Nombre del evento"
                >

            </div>


            <div class="event-basic-info">

                <div class="form-group">

                    <label for="eventSubject">Asignatura</label>
                    <select id="eventSubject">
                    </select>

                </div>

                <div class="form-group">

                    <label for="eventCalendar">Calendario</label>
                    <select id="eventCalendar">
                        <option value="">Selecciona un calendario</option>
                        <option value="bachillerato">Bachillerato</option>
                        <option value="personal">Personal</option>
                    </select>

                </div>

            </div>

            <div class="form-section">

                <h3>Fecha y hora</h3>

                <div class="event-dates">

                    <div class="form-group">

                        <label for="eventDate">Inicio</label>
                        <input 
                            type="date"
                            id="eventDate"
                        >

                    </div>

                    <div class="form-group">

                        <label for="eventEndDate">Fin</label>
                        <input 
                            type="date"
                            id="eventEndDate"
                        >

                    </div>

                </div>


                <div class="event-times">

                    <div class="form-group">

                        <label for="eventTime">Hora de inicio</label>
                        <input 
                            type="time"
                            id="eventTime"
                        >

                    </div>

                    <div class="form-group">

                        <label for="eventEndTime">Hora de finalización</label>
                        <input 
                            type="time"
                            id="eventEndTime"
                        >

                    </div>

                </div>

            </div>

        <div class="advanced-options">

                <button
                    type="button"
                    id="advancedOptionsBtn"
                    class="advanced-options-button"
                >
                    <span>Opciones avanzadas</span>
                    <span class="advanced-arrow">⌄</span>
                </button>


                <div
                    id="advancedOptionsContent"
                    class="advanced-options-content"
                >

                    <div class="form-group">

                        <label class="checkbox-label">
                            <input
                                type="checkbox"
                                id="eventRepeat"
                            >
                            <span>Repetir evento</span>

                        </label>

                    </div>


                    <div
                        id="eventRepeatOptions"
                        class="event-repeat-options"
                        style="display: none;"
                    >

                        <p>Repetir los días:</p>

                        <div class="repeat-days">

                            <label>
                                <input
                                    type="checkbox"
                                    class="event-repeat-day"
                                    value="0"
                                >
                                Lunes
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    class="event-repeat-day"
                                    value="1"
                                >
                                Martes
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    class="event-repeat-day"
                                    value="2"
                                >
                                Miércoles
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    class="event-repeat-day"
                                    value="3"
                                >
                                Jueves
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    class="event-repeat-day"
                                    value="4"
                                >
                                Viernes
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    class="event-repeat-day"
                                    value="5"
                                >
                                Sábado
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    class="event-repeat-day"
                                    value="6"
                                >
                                Domingo
                            </label>

                        </div>

                    </div>


                <div class="form-group">

                        <label class="checkbox-label">
                            <input
                                type="checkbox"
                                id="eventShowInCalendar"
                                checked
                            >

                            <span>Mostrar en el calendario</span>

                        </label>

                    </div>

                </div>

            </div>


            <div class="form-group">

                <label for="eventDescription">Descripción</label>

                <textarea
                    id="eventDescription"
                    placeholder="Añade una descripción..."
                ></textarea>

            </div>


        <p class="form-error" id="formError"></p>


            <div class="form-buttons">

                <button id="cancelEvent">
                    Cancelar
                </button>

                <button id="saveEvent">
                    Guardar
                </button>

            </div>

        </div>

    </div>





    <div class="event-info-modal" id="eventInfoModal">

        <div class="event-info">

            <div class="info-header">

                <h2 id="infoTitle"></h2>

                <button id="closeInfo">Cerrar</button>

            </div>
            

            <div class="info-row">
                <strong>Asignatura:</strong>
                <span id="infoSubject"></span>
            </div>

            <div class="info-row">
                <strong>Fecha:</strong>
                <span id="infoDate"></span>
            </div>

            <div class="info-row">
                <strong>Hora:</strong>
                <span id="infoTime"></span>
            </div>

            <div class="info-row">
                <strong>Descripción:</strong>
                <span id="infoDescription"></span>
            </div>


            <div class="info-buttons">
                <button id="editEvent">Editar</button>
                <button id="deleteEvent">Eliminar</button>
            </div>
            

            

        </div>
    </div>





    <div class="modal" id="calendarModal">

        <div class="calendar-form">

            <h2>Nuevo calendario</h2>

            <p>Crea un calendario para organizar tus eventos.</p>

            <input
                type="text"
                id="calendarName"
                placeholder="Nombre del calendario"
                maxlength="25"
            >

            <p class="form-error" id="calendarError"></p>

            <div class="form-buttons">

                <button id="cancelCalendar">
                    Cancelar
                </button>

                <button id="saveCalendar">
                    Crear calendario
                </button>

            </div>

        </div>

    </div>



    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script src="script.js"></script>
    <script src="subjects.js"></script>
    <script src="calendar.js"></script>
</body>
</html>
